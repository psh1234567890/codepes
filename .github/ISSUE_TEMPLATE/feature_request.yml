name: 기능 제안
description: CodePes를 더 유용하게 만들 새로운 기능이나 개선점을 제안해 주세요.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 불편이나 한계가 있는지 사용자 관점에서 설명해 주세요.
      placeholder: 대회를 찾거나 준비하는 과정에서 겪는 문제를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 동작과 사용 흐름을 구체적으로 설명해 주세요.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - 대회 검색 및 필터
        - 대회 데이터
        - 북마크 및 일정
        - 접근성 및 사용성
        - 개발 및 운영
        - 기타
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 해결 방법이나 임시로 사용 중인 방법이 있다면 적어 주세요.

  - type: textarea
    id: additional
    attributes:
      label: 추가 자료
      description: 참고 서비스, 화면 예시, 관련 링크 등이 있다면 첨부해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 비슷한 기능 제안이 이미 등록되어 있는지 검색했습니다.
          required: true
        - label: 이 제안이 CodePes의 대회 탐색 목적과 관련되어 있습니다.
          required: true
